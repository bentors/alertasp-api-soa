spring:
  application:
    name: alertasp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alertasp}
    username: ${DB_USER:alertasp}
    password: ${DB_PASSWORD:alertasp}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
